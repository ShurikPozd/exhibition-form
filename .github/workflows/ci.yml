name: CI

# Прогон при каждом пуше в main и в каждом pull request: проверки форматирования,
# стиля и тестов. Секреты не нужны — conftest.py выставляет тестовые значения сам.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: black, flake8, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Подготовить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Форматирование (black)
        run: black --check .

      - name: Стиль (flake8)
        run: flake8

      - name: Тесты (pytest)
        run: pytest -q